<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="1280" height="960" font-family="Calibre, Calibri, Carlito, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">
<rect width="1280" height="960" fill="#ffffff"/>
<line x1="192" y1="180" x2="1069" y2="430" stroke="#d6e9f4" stroke-width="18"/>
<line x1="192" y1="180" x2="520" y2="735" stroke="#d6e9f4" stroke-width="18"/>
<line x1="1069" y1="430" x2="520" y2="735" stroke="#d6e9f4" stroke-width="18"/>
<line x1="192" y1="180" x2="1069" y2="430" stroke="#ffffff" stroke-width="14"/>
<line x1="192" y1="180" x2="520" y2="735" stroke="#ffffff" stroke-width="14"/>
<line x1="1069" y1="430" x2="520" y2="735" stroke="#ffffff" stroke-width="14"/>
<circle cx="192" cy="180" r="167" fill="#fff" stroke="#d6e9f4" stroke-width="3"/>
<circle cx="192" cy="180" r="154" fill="none" stroke="#d6e9f4" stroke-width="2"/>
<text x="192" y="129" font-size="42" font-weight="700" fill="#799dad">Nuchter</text>
<text x="192" y="170" font-size="23" fill="#a9d6ea">We houden van eenvoud.</text>
<text x="192" y="198" font-size="23" fill="#a9d6ea">Geen grote gebaren,</text>
<text x="192" y="226" font-size="23" fill="#a9d6ea">geen theater en geen</text>
<text x="192" y="254" font-size="23" fill="#a9d6ea">utopische beloften.</text>
<circle cx="1069" cy="430" r="205" fill="#fff" stroke="#d6e9f4" stroke-width="3"/>
<circle cx="1069" cy="430" r="192" fill="none" stroke="#d6e9f4" stroke-width="2"/>
<text x="1069" y="360" font-size="26" font-weight="700" fill="#799dad">Kwaliteitsgedreven</text>
<text x="1069" y="401" font-size="23" fill="#a9d6ea">Onze professionaliteit volgt</text>
<text x="1069" y="429" font-size="23" fill="#a9d6ea">geen hypes, maar kwaliteit.</text>
<text x="1069" y="457" font-size="23" fill="#a9d6ea">We geloven in voortdurend</text>
<text x="1069" y="485" font-size="23" fill="#a9d6ea">groeien en streven naar</text>
<text x="1069" y="513" font-size="23" fill="#a9d6ea">het beste.</text>
<circle cx="520" cy="735" r="215" fill="#fff" stroke="#d6e9f4" stroke-width="3"/>
<circle cx="520" cy="735" r="202" fill="none" stroke="#d6e9f4" stroke-width="2"/>
<text x="520" y="693" font-size="26" font-weight="700" fill="#799dad">Gebruiksvriendelijk</text>
<text x="520" y="734" font-size="23" fill="#a9d6ea">Met onze oplossing bouwen</text>
<text x="520" y="762" font-size="23" fill="#a9d6ea">we bruggen tussen</text>
<text x="520" y="790" font-size="23" fill="#a9d6ea">gebruikers en systemen.</text>
</svg>